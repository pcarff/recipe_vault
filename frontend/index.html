<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipes</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            overflow-y: scroll;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .transition-opacity {
            transition: opacity 0.3s ease;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #recipeModal,
            #recipeModal * {
                visibility: visible;
                overflow: visible !important;
            }

            body {
                background-color: white !important;
                overflow: visible !important;
                height: auto !important;
                margin: 0;
                padding: 0;
            }

            body * {
                visibility: hidden;
            }

            nav,
            main,
            #editModal,
            #manageCatsModal {
                display: none !important;
            }

            #recipeModal {
                visibility: visible;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                background: white !important;
                display: block !important;
            }

            #recipeModal * {
                visibility: visible;
            }

            #recipeModal .fixed.inset-0.bg-gray-900 {
                display: none !important;
            }

            #recipeModal .fixed.inset-0.z-10 {
                position: static !important;
                overflow: visible !important;
            }

            #recipeModal .flex.min-h-full {
                display: block !important;
                min-height: 0 !important;
                align-items: start !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            #recipeModal .transform.overflow-hidden {
                transform: none !important;
                overflow: visible !important;
                box-shadow: none !important;
                margin: 0 !important;
                border-radius: 0 !important;
                max-width: 100% !important;
            }

            .no-print {
                display: none !important;
            }

            #modalImg {
                max-width: 45%;
                max-height: 400px;
                object-fit: contain;
                margin: 0;
                display: block;
            }

            .bg-gradient-to-t {
                display: none !important;
            }

            #modalTitle {
                color: black !important;
                text-shadow: none !important;
                margin-top: 0 !important;
                position: static !important;
                text-align: left !important;
            }

            #modalAuthor,
            #modalYield,
            #modalPrep,
            #modalCategories,
            #modalKeywords,
            .flex.flex-wrap.items-center.text-gray-200.gap-4 {
                justify-content: flex-start !important;
            }

            .w-full.h-80.bg-gray-200.relative {
                height: auto !important;
                background: none !important;
                margin-bottom: 2rem;
                display: flex !important;
                flex-direction: row !important;
                align-items: flex-start !important;
                gap: 2rem !important;
            }

            .absolute.bottom-0.left-0.p-8.w-full.max-h-full.overflow-y-auto.no-scrollbar {
                position: static !important;
                padding: 0 !important;
                overflow: visible !important;
                max-height: none !important;
                flex: 1 !important;
                width: auto !important;
            }

            .p-8.grid {
                padding: 0 !important;
                display: block !important;
            }

            .p-8.grid>div {
                margin-bottom: 2rem;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            h3.border-b {
                border-bottom: 2px solid #000 !important;
                color: #000 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>

<body class="text-gray-800 antialiased">

    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between h-auto md:h-16 py-3 md:py-0">
                <div class="flex items-center justify-between mb-3 md:mb-0">
                    <span class="text-2xl font-bold text-indigo-600 tracking-tight">RecipeVault</span>
                </div>
                <div
                    class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0 sm:space-x-3 w-full md:w-auto">
                    <div class="relative w-full sm:w-56">
                        <input type="text" id="searchInput" placeholder="Search (use quotes for exact)..."
                            class="w-full pl-9 pr-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 transition-all">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>

                    <div class="flex space-x-2 w-full sm:w-auto">
                        <select id="cookbookSelect"
                            class="px-4 py-2 border border-blue-300 rounded-full focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50 text-blue-700 font-bold shadow-sm"
                            onchange="loadRecipes()">
                            <option value="">All Cookbooks</option>
                        </select>

                        <select id="categorySelect"
                            class="px-4 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-gray-50 text-gray-700 shadow-sm"
                            onchange="loadRecipes()">
                            <option value="">All Categories</option>
                        </select>

                        <select id="sortSelect" onchange="loadRecipes()"
                            class="border rounded-full py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50 text-gray-700 cursor-pointer flex-1 sm:w-32 truncate">
                            <option value="recent">Sort: Newest</option>
                            <option value="oldest">Sort: Oldest</option>
                            <option value="title_asc">Sort: A-Z</option>
                            <option value="title_desc">Sort: Z-A</option>
                        </select>
                    </div>

                    <div class="flex space-x-2 w-full sm:w-auto justify-end">
                        <button onclick="openAssigner()"
                            class="border border-green-200 text-green-700 hover:bg-green-50 px-3 py-2 rounded-full text-sm font-medium transition-colors shadow-sm whitespace-nowrap"
                            title="Rapid Image Assigner">
                            <span class="mr-1">🪄</span> Images
                        </button>

                        <button onclick="window.location.href='http://localhost:8080/api/backup'"
                            class="border border-green-200 text-green-700 hover:bg-green-50 px-3 py-2 rounded-full text-sm font-medium transition-colors shadow-sm whitespace-nowrap"
                            title="Backup Database to ZIP">
                            <svg class="w-4 h-4 inline-block -mt-0.5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                        </button>

                        <input type="file" id="importMz2File" accept=".mz2,.mx2" class="hidden"
                            onchange="handleImportMz2(event)">
                        <button onclick="document.getElementById('importMz2File').click()"
                            class="border border-purple-200 text-purple-700 hover:bg-purple-50 px-3 py-2 rounded-full text-sm font-medium transition-colors shadow-sm whitespace-nowrap"
                            title="Import MZ2 Cookbook">
                            <span class="mr-1">📤</span> Import
                        </button>

                        <input type="file" id="restoreFile" accept=".zip" class="hidden"
                            onchange="handleRestore(event)">
                        <button onclick="document.getElementById('restoreFile').click()"
                            class="border border-orange-200 text-orange-700 hover:bg-orange-50 px-3 py-2 rounded-full text-sm font-medium transition-colors shadow-sm whitespace-nowrap"
                            title="Restore from ZIP">
                            <svg class="w-4 h-4 inline-block -mt-0.5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                        </button>

                        <button onclick="_showModal('manageCookbooksModal')"
                            class="border border-blue-200 text-blue-700 hover:bg-blue-50 px-3 py-2 rounded-full text-sm font-medium transition-colors shadow-sm whitespace-nowrap"
                            title="Manage Cookbooks">
                            <svg class="w-4 h-4 inline-block -mt-0.5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477-4.5 1.253">
                                </path>
                            </svg>
                        </button>

                        <button onclick="_showModal('manageCatsModal')"
                            class="border border-indigo-200 text-indigo-700 hover:bg-indigo-50 px-3 py-2 rounded-full text-sm font-medium transition-colors shadow-sm whitespace-nowrap"
                            title="Manage Categories">
                            <svg class="w-4 h-4 inline-block -mt-0.5" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z">
                                </path>
                            </svg>
                        </button>
                        <button onclick="openEditModal()"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-full text-sm font-medium transition-colors shadow-sm flex items-center whitespace-nowrap">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 4v16m8-8H4"></path>
                            </svg> Add
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- Recipe Detail Modal -->
    <div id="recipeModal" class="fixed inset-0 z-50 hidden opacity-0 transition-opacity" aria-labelledby="modal-title"
        role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm" onclick="closeModal('recipeModal')"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto no-scrollbar">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl sm:my-8 sm:w-full sm:max-w-4xl transition-all">

                    <div class="absolute top-4 right-4 z-10 flex space-x-2 no-print">
                        <button onclick="window.print()"
                            class="bg-gray-600/80 hover:bg-gray-600 text-white rounded-full p-2 transition-colors"
                            title="Print">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
                                </path>
                            </svg>
                        </button>
                        <button onclick="editCurrentRecipe()"
                            class="bg-blue-600/80 hover:bg-blue-600 text-white rounded-full p-2 transition-colors"
                            title="Edit">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                                </path>
                            </svg>
                        </button>
                        <button onclick="deleteCurrentRecipe()"
                            class="bg-red-600/80 hover:bg-red-600 text-white rounded-full p-2 transition-colors"
                            title="Delete">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                </path>
                            </svg>
                        </button>
                        <button onclick="closeModal('recipeModal')"
                            class="bg-black/50 hover:bg-black/70 text-white rounded-full p-2 transition-colors"
                            title="Close">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="w-full h-80 bg-gray-200 relative">
                        <img id="modalImg" src="" alt="" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent"></div>
                        <div class="absolute bottom-0 left-0 p-8 w-full max-h-full overflow-y-auto no-scrollbar">
                            <h2 id="modalTitle"
                                class="text-3xl md:text-4xl font-bold text-white mb-2 leading-tight drop-shadow-md">
                            </h2>
                            <div class="flex flex-wrap items-center text-gray-200 gap-4 text-sm font-medium mb-3">
                                <span id="modalAuthor" class="flex items-center drop-shadow"><svg
                                        class="w-4 h-4 mr-1 pb-0.5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                                        </path>
                                    </svg><span class="label"></span></span>
                                <span id="modalYield" class="flex items-center drop-shadow"><svg
                                        class="w-4 h-4 mr-1 pb-0.5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path
                                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                                        </path>
                                    </svg><span class="label"></span></span>
                                <span id="modalPrep" class="flex items-center drop-shadow"><svg
                                        class="w-4 h-4 mr-1 pb-0.5" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg><span class="label"></span></span>
                            </div>
                            <div id="modalCategories" class="flex flex-wrap gap-2 mb-2"></div>
                            <div id="modalKeywords" class="flex flex-wrap gap-2"></div>
                        </div>
                    </div>

                    <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-10 bg-white">
                        <div class="md:col-span-1">
                            <h3 class="text-xl font-bold text-gray-900 mb-4 border-b pb-2">Ingredients</h3>
                            <ul id="modalIngredients" class="space-y-3 text-gray-700"></ul>
                        </div>
                        <div class="md:col-span-2">
                            <h3 class="text-xl font-bold text-gray-900 mb-4 border-b pb-2">Instructions</h3>
                            <div id="modalInstructions" class="space-y-6 text-gray-700 leading-relaxed"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit/Add Form Modal -->
    <div id="editModal" class="fixed inset-0 z-[60] hidden opacity-0 transition-opacity" aria-labelledby="modal-title"
        role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm" onclick="closeModal('editModal')"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto no-scrollbar">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl sm:my-8 sm:w-full sm:max-w-3xl transition-all">
                    <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-900" id="editModalTitle">Edit Recipe</h3>
                        <button onclick="closeModal('editModal')" class="text-gray-400 hover:text-gray-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="px-6 py-4">
                        <input type="hidden" id="editId">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                                <input type="text" id="editTitle"
                                    class="w-full border-gray-300 border rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                            </div>

                            <div class="col-span-2 mt-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Recipe Photo</label>
                                <div class="flex items-center space-x-4">
                                    <div class="h-16 w-16 bg-gray-200 rounded object-cover overflow-hidden"
                                        id="editImagePreviewWrapper">
                                        <img id="editImagePreview" src="" class="w-full h-full object-cover hidden">
                                    </div>
                                    <input type="file" id="editImageFile" accept="image/png, image/jpeg" class="w-full text-sm text-gray-500
                                    file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold
                                    file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 " />
                                </div>
                            </div>

                            <div class="col-span-2 mt-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Categories (Hold Ctrl/Cmd to
                                    select multiple)</label>
                                <select id="editCategories" multiple size="4"
                                    class="w-full border-gray-300 border rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm text-gray-700"></select>
                            </div>

                            <div class="col-span-2 mt-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Keywords / Tags (comma
                                    separated)</label>
                                <input type="text" id="editKeywords"
                                    placeholder="e.g. Chicken, Dinner, Spicy, Gluten-Free"
                                    class="w-full border-gray-300 border rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Keywords</label>
                                <input type="text" id="editKeywords"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md"
                                    placeholder="e.g. spicy, vegan">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Cookbook</label>
                                <select id="editCookbook"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white">
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1 mt-2">Author</label>
                            <input type="text" id="editAuthor"
                                class="w-full border-gray-300 border rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1 mt-2">Yield /
                                Servings</label>
                            <input type="text" id="editYield"
                                class="w-full border-gray-300 border rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1 mt-2">Prep Time</label>
                            <input type="text" id="editPrep"
                                class="w-full border-gray-300 border rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        </div>
                    </div>

                    <div class="mb-6">
                        <div class="flex justify-between items-end mb-2">
                            <label class="block text-sm font-medium text-gray-700">Ingredients</label>
                            <button type="button" onclick="addIngredientRow()"
                                class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ Add Row</button>
                        </div>
                        <div id="editIngredients" class="space-y-2"></div>
                    </div>

                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <label class="block text-sm font-medium text-gray-700">Instructions</label>
                            <button type="button" onclick="addInstructionRow()"
                                class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ Add
                                Step</button>
                        </div>
                        <div id="editInstructions" class="space-y-2"></div>
                    </div>
                </div>

                <div class="bg-gray-50 px-6 py-4 border-t flex justify-end space-x-3">
                    <button onclick="closeModal('editModal')"
                        class="px-4 py-2 border rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">Cancel</button>
                    <button id="saveBtn" onclick="saveRecipe()"
                        class="px-4 py-2 bg-indigo-600 rounded-md text-sm font-medium text-white hover:bg-indigo-700 transition flex items-center">
                        <span id="saveTxt">Save Recipe</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Manage Categories Modal -->
    <div id="manageCatsModal" class="fixed inset-0 z-[70] hidden opacity-0 transition-opacity"
        aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-900 bg-opacity-75 backdrop-blur-sm" onclick="closeModal('manageCatsModal')">
        </div>
        <div class="fixed inset-0 z-10 overflow-y-auto no-scrollbar">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <div
                    class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl sm:my-8 sm:w-full sm:max-w-md transition-all">
                    <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-900">Manage Categories</h3>
                        <button onclick="closeModal('manageCatsModal')" class="text-gray-400 hover:text-gray-500">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="px-6 py-4">
                        <div class="flex mb-4">
                            <input type="text" id="newCategoryName" placeholder="New category name..."
                                class="flex-1 border-gray-300 border rounded-l-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                            <button onclick="addCategory()"
                                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-r-md text-sm font-medium transition-colors border border-indigo-600">Add</button>
                        </div>
                        <div class="max-h-96 overflow-y-auto border rounded-md divide-y" id="manageCatsList"></div>
                    </div>
                    <div class="bg-gray-50 px-6 py-4 border-t flex justify-end space-x-3">
                        <div class="mt-4 flex justify-end">
                            <button onclick="closeModal('manageCatsModal')"
                                class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Done</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Manage Cookbooks Modal -->
    <div id="manageCookbooksModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Manage Cookbooks</h2>
            <div class="flex space-x-2 mb-4">
                <input type="text" id="newCookbookName" class="flex-1 px-3 py-2 border border-gray-300 rounded"
                    placeholder="New Cookbook Name">
                <button onclick="addCookbook()"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add</button>
            </div>
            <div class="max-h-60 overflow-y-auto border border-gray-200 rounded">
                <ul id="cookbooksList" class="divide-y divide-gray-200"></ul>
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="closeModal('manageCookbooksModal')"
                    class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300">Done</button>
            </div>
        </div>
    </div>
    <!-- Rapid Assigner Modal -->
    <div id="assignerModal"
        class="fixed inset-0 z-[80] hidden opacity-0 transition-opacity bg-black bg-opacity-75 flex items-center justify-center p-4">
        <div
            class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-300">
            <!-- Header -->
            <div class="p-6 border-b border-gray-100 flex justify-between items-start bg-gray-50">
                <div>
                    <div class="text-sm font-semibold text-blue-600 tracking-wider uppercase mb-1">Rapid Image Assigner
                    </div>
                    <h2 id="assignerRecipeTitle" class="text-3xl font-extrabold text-gray-900 leading-tight">Loading...
                    </h2>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="loadNextAssignerRecipe()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 font-medium rounded-full hover:bg-gray-300 transition-colors">
                        Skip <span aria-hidden="true">&rarr;</span>
                    </button>
                    <button onclick="closeModal('assignerModal')"
                        class="p-2 text-gray-400 hover:text-gray-600 bg-white rounded-full shadow-sm hover:shadow transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Search Area -->
            <div class="px-6 py-4 bg-white border-b border-gray-100">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="assignerSearch"
                        class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors"
                        placeholder="Filter unused images by keyword..." oninput="filterAssignerImages()">
                </div>
            </div>

            <!-- Image Grid Content -->
            <div class="flex-1 overflow-y-auto p-6 bg-gray-50">
                <div id="assignerGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Images populate here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let searchTimeout = null;
        let currentRecipeData = null;
        let currentImageBase64 = null;
        let currentImageFilename = null;
        let allCategories = [];
        let allCookbooks = [];
        let currentOffset = 0;
        let isLoading = false;
        let hasMore = true;

        async function loadCookbooks() {
            try {
                const response = await fetch('http://localhost:8080/api/cookbooks');
                allCookbooks = await response.json();

                const select = document.getElementById('cookbookSelect');
                const editSelect = document.getElementById('editCookbook');

                // Keep first option
                select.innerHTML = '<option value="">All Cookbooks</option>';
                editSelect.innerHTML = '';

                allCookbooks.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                    editSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
                renderCookbooksList();
            } catch (error) { console.error('Error fetching cookbooks:', error); }
        }

        function renderCookbooksList() {
            const list = document.getElementById('cookbooksList');
            if (!list) return;
            list.innerHTML = '';
            allCookbooks.forEach(c => {
                list.innerHTML += `
                    <li class="p-3 flex justify-between items-center hover:bg-gray-50">
                        <span class="text-gray-800 flex-1 cursor-pointer" onclick="renameCookbook(${c.id}, '${c.name.replace(/'/g, "\\'")}')">${c.name}</span>
                        <button onclick="deleteCookbook(${c.id})" class="text-red-500 hover:bg-red-50 p-1 rounded transition-colors ml-2" title="Delete Cookbook"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </li>
                `;
            });
        }

        async function addCookbook() {
            const name = document.getElementById('newCookbookName').value.trim();
            if (!name) return;
            try {
                const res = await fetch('http://localhost:8080/api/cookbooks', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
                });
                if (res.ok) { document.getElementById('newCookbookName').value = ''; await loadCookbooks(); }
                else { alert("Error adding cookbook"); }
            } catch (e) { alert("Error adding cookbook"); }
        }

        async function renameCookbook(id, oldName) {
            const newName = prompt("Rename Cookbook:", oldName);
            if (!newName || newName === oldName) return;
            try {
                const res = await fetch(`http://localhost:8080/api/cookbooks/${id}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: newName })
                });
                if (res.ok) await loadCookbooks();
                else alert("Error renaming cookbook");
            } catch (e) { alert("Error renaming cookbook"); }
        }

        async function deleteCookbook(id) {
            if (!confirm("Are you sure you want to delete this cookbook? Recipes will be moved to Master Cookbook.")) return;
            try {
                const res = await fetch(`http://localhost:8080/api/cookbooks/${id}`, { method: 'DELETE' });
                if (res.ok) { await loadCookbooks(); loadRecipes(); }
                else alert("Error deleting cookbook");
            } catch (e) { alert("Error deleting cookbook"); }
        }

        let unassignedImages = [];
        let currentAssignerRecipeId = null;

        async function openAssigner() {
            try {
                const res = await fetch('http://localhost:8080/api/images/unassigned');
                unassignedImages = await res.json();
            } catch (e) { console.error(e); }

            _showModal('assignerModal');
            loadNextAssignerRecipe();
        }

        async function loadNextAssignerRecipe() {
            document.getElementById('assignerRecipeTitle').innerText = 'Loading next recipe...';
            document.getElementById('assignerGrid').innerHTML = '';
            currentAssignerRecipeId = null;

            try {
                const res = await fetch('http://localhost:8080/api/recipes/missing_image');
                const data = await res.json();

                if (!data.recipe) {
                    document.getElementById('assignerRecipeTitle').innerText = '🎉 All recipes have an image!';
                    document.getElementById('assignerSearch').value = '';
                    filterAssignerImages(); // Show all remaining unused images
                    return;
                }

                currentAssignerRecipeId = data.recipe.id;
                document.getElementById('assignerRecipeTitle').innerText = data.recipe.title;

                // Pre-fill search
                const stopWords = ['a', 'an', 'the', 'and', 'to', 'of', 'in', 'for', 'with', 'on', 'how', 'make', 'recipe', 'best'];
                const words = data.recipe.title.toLowerCase().replace(/[^a-z0-ns]/g, ' ').split(/\s+/);
                const searchWords = words.filter(w => w.length > 2 && !stopWords.includes(w)).slice(0, 3);
                document.getElementById('assignerSearch').value = searchWords.join(' ');

                filterAssignerImages();
            } catch (e) {
                console.error(e);
                document.getElementById('assignerRecipeTitle').innerText = 'Error loading recipe';
            }
        }

        function filterAssignerImages() {
            const query = document.getElementById('assignerSearch').value.toLowerCase().trim();
            const grid = document.getElementById('assignerGrid');
            grid.innerHTML = '';

            const searchTerms = query.split(/\s+/);

            let scoredImages = unassignedImages.map(img => {
                const imgLower = img.toLowerCase();
                let score = 0;
                searchTerms.forEach(term => {
                    if (term && imgLower.includes(term)) score += 1;
                });
                return { img, score };
            });

            if (query) {
                scoredImages.sort((a, b) => b.score - a.score);
                scoredImages = scoredImages.filter(s => s.score > 0);
            }

            if (scoredImages.length === 0 && query) {
                grid.innerHTML = '<p class="text-white col-span-full text-center py-10 opacity-70">No matching thumbnails found.</p>';
                return;
            }

            scoredImages.slice(0, 80).forEach(s => {
                const imgUrl = `http://localhost:8080/images/${encodeURIComponent(s.img)}`;
                grid.innerHTML += `
                    <div class="relative group cursor-pointer" onclick="assignImageToRecipe('${s.img.replace(/'/g, "\\'")}')">
                        <img src="${imgUrl}" class="object-cover w-full h-32 sm:h-40 rounded-lg shadow-lg border-4 border-transparent group-hover:border-blue-500 transition-all opacity-90 group-hover:opacity-100" loading="lazy">
                        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black to-transparent pt-6 pb-2 px-2 rounded-b-lg">
                            <p class="text-white text-xs truncate font-medium drop-shadow-md">${s.img}</p>
                        </div>
                    </div>
                `;
            });
        }

        async function assignImageToRecipe(filename) {
            if (!currentAssignerRecipeId) return;
            try {
                const res = await fetch(`http://localhost:8080/api/recipes/${currentAssignerRecipeId}/image`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_path: filename })
                });
                if (res.ok) {
                    unassignedImages = unassignedImages.filter(img => img !== filename);
                    loadNextAssignerRecipe();
                    loadRecipes(true);
                } else {
                    alert("Failed to assign image");
                }
            } catch (e) { console.error(e); alert("Error assigning image"); }
        }

        async function loadCategories() {
            try {
                const response = await fetch('http://localhost:8080/api/categories');
                allCategories = await response.json();

                // Populate Nav Dropdown
                const navSelect = document.getElementById('categorySelect');
                navSelect.innerHTML = '<option value="">All Categories</option>';
                allCategories.forEach(c => {
                    navSelect.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });

                // Populate Manage Modal List
                const list = document.getElementById('manageCatsList');
                list.innerHTML = '';
                if (allCategories.length === 0) {
                    list.innerHTML = '<div class="p-4 text-sm text-gray-500 text-center">No categories found.</div>';
                } else {
                    allCategories.forEach(c => {
                        list.innerHTML += `
                        <div class="flex justify-between items-center p-3 hover:bg-gray-50">
                            <div class="text-sm font-medium text-gray-700 truncate mr-2" id="cat-text-${c.id}">${c.name}</div>
                            <div class="hidden flex-1 mr-2" id="cat-edit-div-${c.id}">
                                <input type="text" value="${c.name}" id="cat-input-${c.id}" class="w-full border rounded px-2 py-1 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div class="flex space-x-2 text-gray-400">
                                <button onclick="toggleCatEdit(${c.id})" id="cat-btn-edit-${c.id}" class="hover:text-blue-600" title="Rename"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                                <button onclick="saveCatEdit(${c.id})" id="cat-btn-save-${c.id}" class="hover:text-green-600 hidden" title="Save"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></button>
                                <button onclick="deleteCategory(${c.id})" class="hover:text-red-600" title="Delete"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                            </div>
                        </div>
                    `;
                    });
                }
            } catch (e) { console.error("Could not load categories", e); }
        }

        async function addCategory() {
            const input = document.getElementById('newCategoryName');
            const name = input.value.trim();
            if (!name) return;
            try {
                await fetch('http://localhost:8080/api/categories', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name })
                });
                input.value = '';
                await loadCategories();
            } catch (e) { alert("Error adding category"); }
        }

        async function deleteCategory(id) {
            if (!confirm("Delete this category? It will be unlinked from all recipes.")) return;
            try {
                await fetch(`http://localhost:8080/api/categories/${id}`, { method: 'DELETE' });
                await loadCategories();
                loadRecipes(); // refresh list in case filter was active
            } catch (e) { alert("Error deleting category"); }
        }

        function toggleCatEdit(id) {
            document.getElementById(`cat-text-${id}`).classList.add('hidden');
            document.getElementById(`cat-btn-edit-${id}`).classList.add('hidden');
            document.getElementById(`cat-edit-div-${id}`).classList.remove('hidden');
            document.getElementById(`cat-btn-save-${id}`).classList.remove('hidden');
        }

        async function saveCatEdit(id) {
            const newName = document.getElementById(`cat-input-${id}`).value.trim();
            if (!newName) return;
            try {
                await fetch(`http://localhost:8080/api/categories/${id}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: newName })
                });
                await loadCategories();
                loadRecipes();
            } catch (e) { alert("Error renaming category"); }
        }

        async function loadRecipes(reset = true) {
            if (reset) {
                currentOffset = 0;
                hasMore = true;
            }
            if (!hasMore || isLoading) return;

            isLoading = true;
            const query = document.getElementById('searchInput').value;
            const sort = document.getElementById('sortSelect').value;
            const cat = document.getElementById('categorySelect').value;
            const cookbook = document.getElementById('cookbookSelect').value;
            try {
                const params = new URLSearchParams();
                if (query) params.append('q', query);
                params.append('sort', sort);
                if (cat) params.append('category', cat);
                if (cookbook) params.append('cookbook', cookbook);
                params.append('offset', currentOffset);

                const url = `http://localhost:8080/api/recipes?${params.toString()}`;
                const response = await fetch(url);
                const recipes = await response.json();

                const grid = document.getElementById('grid');
                if (reset) grid.innerHTML = '';

                if (reset && recipes.length === 0) {
                    grid.innerHTML = '<p class="text-gray-500 col-span-full py-10 text-center text-lg">No recipes found.</p>';
                    isLoading = false;
                    return;
                }

                if (recipes.length < 60) {
                    hasMore = false;
                }

                recipes.forEach(recipe => {
                    const imgUrl = recipe.image_path ? `http://localhost:8080/images/${recipe.image_path}` : 'https://images.unsplash.com/photo-1495474472201-44eb14b98c39?auto=format&fit=crop&q=80&w=800';

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-sm overflow-hidden card transition-all duration-300 cursor-pointer flex flex-col h-full';
                    card.onclick = () => openRecipe(recipe.id);

                    card.innerHTML = `
                    <div class="h-48 w-full bg-gray-200 overflow-hidden relative flex-shrink-0">
                        <img src="${imgUrl}" alt="${recipe.title}" class="w-full h-full object-cover">
                        ${recipe.prep_time ? `<div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white text-xs px-2 py-1 rounded-md font-medium shadow">${recipe.prep_time}</div>` : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <h2 class="text-lg font-bold text-gray-900 line-clamp-2 leading-tight mb-2">${recipe.title}</h2>
                    </div>
                `;
                    grid.appendChild(card);
                });
                currentOffset += recipes.length;
            } catch (error) {
                console.error('Error fetching recipes:', error);
                if (currentOffset === 0) {
                    document.getElementById('grid').innerHTML = '<p class="text-red-500 col-span-full">Failed to load local DB.</p>';
                }
            }
            isLoading = false;
        }

        async function openRecipe(id) {
            try {
                const response = await fetch(`http://localhost:8080/api/recipes/${id}`);
                currentRecipeData = await response.json();
                const recipe = currentRecipeData;

                const imgUrl = recipe.image_path ? `http://localhost:8080/images/${recipe.image_path}` : 'https://images.unsplash.com/photo-1495474472201-44eb14b98c39?auto=format&fit=crop&q=80&w=800';
                document.getElementById('modalImg').src = imgUrl;
                document.getElementById('modalTitle').innerText = recipe.title;

                document.getElementById('modalAuthor').querySelector('.label').innerText = recipe.author || 'Unknown';
                document.getElementById('modalAuthor').style.display = recipe.author ? 'flex' : 'none';
                document.getElementById('modalYield').querySelector('.label').innerText = recipe.yield || 'N/A';
                document.getElementById('modalYield').style.display = recipe.yield ? 'flex' : 'none';
                document.getElementById('modalPrep').querySelector('.label').innerText = recipe.prep_time || 'N/A';
                document.getElementById('modalPrep').style.display = recipe.prep_time ? 'flex' : 'none';

                // Master Categories Pills
                const catDiv = document.getElementById('modalCategories');
                catDiv.innerHTML = '';
                if (recipe.categories && recipe.categories.length > 0) {
                    recipe.categories.forEach(c => {
                        catDiv.innerHTML += `<span class="bg-blue-600/90 shadow text-white text-xs px-2.5 py-1 rounded-md font-bold uppercase tracking-wide inline-block">${c.name}</span>`;
                    });
                }

                // Custom User Keyword Pills
                const keywordsDiv = document.getElementById('modalKeywords');
                keywordsDiv.innerHTML = '';
                if (recipe.keywords) {
                    const tags = recipe.keywords.split(',').map(s => s.trim()).filter(s => s);
                    tags.forEach(tag => {
                        keywordsDiv.innerHTML += `<span class="bg-indigo-600/80 shadow backdrop-blur text-white text-xs px-2.5 py-1 rounded-md font-medium inline-block flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>${tag}</span>`;
                    });
                }

                const ingList = document.getElementById('modalIngredients');
                ingList.innerHTML = '';
                if (recipe.ingredients && recipe.ingredients.length > 0) {
                    recipe.ingredients.forEach(ing => {
                        let text = '';
                        if (ing.amount) text += `<b>${ing.amount}</b> `;
                        if (ing.unit) text += `${ing.unit} `;
                        text += ing.item;
                        ingList.innerHTML += `<li class="flex items-start"><span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mt-2 mr-2 flex-shrink-0"></span><span>${text}</span></li>`;
                    });
                }

                const insList = document.getElementById('modalInstructions');
                insList.innerHTML = '';
                if (recipe.instructions && recipe.instructions.length > 0) {
                    recipe.instructions.forEach(step => {
                        insList.innerHTML += `<div class="flex"><span class="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold mr-4">${step.step_number}</span><p class="pt-1">${step.text}</p></div>`;
                    });
                }

                _showModal('recipeModal');
            } catch (e) {
                console.error(e);
            }
        }

        function _showModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (document.querySelectorAll('.fixed.inset-0:not(.hidden)').length === 0) {
                    document.body.style.overflow = 'auto'; // Re-enable background scrolling if ALL modals are closed
                }
            }, 300);
        }

        async function deleteCurrentRecipe() {
            if (!currentRecipeData || !confirm(`Are you sure you want to delete "${currentRecipeData.title}"?`)) return;
            try {
                await fetch(`http://localhost:8080/api/recipes/${currentRecipeData.id}`, { method: 'DELETE' });
                closeModal('recipeModal');
                loadRecipes();
            } catch (e) { alert('Failed to delete recipe.'); }
        }

        function addIngredientRow(amount = '', unit = '', item = '') {
            const div = document.createElement('div');
            div.className = 'flex space-x-2 ing-row';
            div.innerHTML = `
            <input type="text" placeholder="Amt" value="${amount}" class="w-16 border rounded py-1 px-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            <input type="text" placeholder="Unit" value="${unit}" class="w-20 border rounded py-1 px-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            <input type="text" placeholder="Ingredient" value="${item}" class="flex-1 border rounded py-1 px-2 text-sm focus:ring-indigo-500 focus:border-indigo-500">
            <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2 font-bold">&times;</button>
        `;
            document.getElementById('editIngredients').appendChild(div);
        }

        function addInstructionRow(text = '') {
            const div = document.createElement('div');
            div.className = 'flex space-x-2 ins-row';
            div.innerHTML = `
            <textarea placeholder="Instruction step..." class="flex-1 border rounded py-1 px-2 text-sm focus:ring-indigo-500 focus:border-indigo-500" rows="2">${text}</textarea>
            <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-2 font-bold">&times;</button>
        `;
            document.getElementById('editInstructions').appendChild(div);
        }

        function openEditModal(isNew = true) {
            document.getElementById('editIngredients').innerHTML = '';
            document.getElementById('editInstructions').innerHTML = '';
            currentImageBase64 = null;
            currentImageFilename = null;
            document.getElementById('editImageFile').value = '';

            // Populate Categories Multi-select Box
            const catSelect = document.getElementById('editCategories');
            catSelect.innerHTML = '';
            allCategories.forEach(c => {
                const isSelected = (!isNew && currentRecipeData && currentRecipeData.categories && currentRecipeData.categories.find(rc => rc.id === c.id)) ? 'selected' : '';
                catSelect.innerHTML += `<option value="${c.id}" ${isSelected}>${c.name}</option>`;
            });

            let preview = document.getElementById('editImagePreview');

            if (isNew || !currentRecipeData) {
                document.getElementById('editModalTitle').innerText = 'Add New Recipe';
                document.getElementById('editId').value = '';
                document.getElementById('editTitle').value = '';
                document.getElementById('editAuthor').value = '';
                document.getElementById('editYield').value = '';
                document.getElementById('editPrep').value = '';
                document.getElementById('editKeywords').value = '';
                document.getElementById('editCookbook').value = '1';
                preview.src = '';
                preview.classList.add('hidden');
                addIngredientRow();
                addInstructionRow();
            } else {
                document.getElementById('editModalTitle').innerText = 'Edit Recipe';
                document.getElementById('editId').value = currentRecipeData.id;
                document.getElementById('editTitle').value = currentRecipeData.title || '';
                document.getElementById('editAuthor').value = currentRecipeData.author || '';
                document.getElementById('editYield').value = currentRecipeData.yield || '';
                document.getElementById('editPrep').value = currentRecipeData.prep_time || '';
                document.getElementById('editKeywords').value = currentRecipeData.keywords || '';
                if (currentRecipeData.cookbook_id) document.getElementById('editCookbook').value = currentRecipeData.cookbook_id;

                if (currentRecipeData.image_path) {
                    preview.src = `http://localhost:8080/images/${currentRecipeData.image_path}`;
                    preview.classList.remove('hidden');
                } else { preview.src = ''; preview.classList.add('hidden'); }

                if (currentRecipeData.ingredients && currentRecipeData.ingredients.length > 0) {
                    currentRecipeData.ingredients.forEach(i => addIngredientRow(i.amount, i.unit, i.item));
                } else { addIngredientRow(); }

                if (currentRecipeData.instructions && currentRecipeData.instructions.length > 0) {
                    currentRecipeData.instructions.forEach(i => addInstructionRow(i.text));
                } else { addInstructionRow(); }

                closeModal('recipeModal'); // Hide viewer behind it
            }
            _showModal('editModal');
        }

        document.getElementById('editImageFile').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            currentImageFilename = file.name;
            const reader = new FileReader();
            reader.onload = function (event) {
                currentImageBase64 = event.target.result;
                const preview = document.getElementById('editImagePreview');
                preview.src = currentImageBase64;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        function editCurrentRecipe() {
            openEditModal(false);
        }

        async function saveRecipe() {
            if (!document.getElementById('editTitle').value.trim()) { alert('Recipe title is required!'); return; }

            const id = document.getElementById('editId').value;
            const btn = document.getElementById('saveBtn');
            const txt = document.getElementById('saveTxt');

            btn.disabled = true;
            txt.innerText = 'Saving...';

            const ingredients = Array.from(document.querySelectorAll('.ing-row')).map(row => {
                const inputs = row.querySelectorAll('input');
                return { amount: inputs[0].value, unit: inputs[1].value, item: inputs[2].value };
            }).filter(i => i.item.trim() !== '');

            const instructions = Array.from(document.querySelectorAll('.ins-row')).map(row => {
                return { text: row.querySelector('textarea').value };
            }).filter(i => i.text.trim() !== '');

            // Extract selected categories
            const catSelect = document.getElementById('editCategories');
            const selectedCatIds = Array.from(catSelect.selectedOptions).map(opt => parseInt(opt.value));

            const payload = {
                title: document.getElementById('editTitle').value,
                author: document.getElementById('editAuthor').value,
                yield: document.getElementById('editYield').value,
                prep_time: document.getElementById('editPrep').value,
                keywords: document.getElementById('editKeywords').value,
                ingredients: ingredients,
                instructions: instructions,
                category_ids: selectedCatIds,
                cookbook_id: document.getElementById('editCookbook').value
            };

            if (currentImageBase64) {
                payload.image_base64 = currentImageBase64;
                payload.image_filename = currentImageFilename;
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `http://localhost:8080/api/recipes/${id}` : `http://localhost:8080/api/recipes`;

            try {
                await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                closeModal('editModal');
                loadRecipes();
            } catch (e) { alert('Error saving recipe.'); console.error(e); }
            finally { btn.disabled = false; txt.innerText = 'Save Recipe'; }
        }
        async function handleImportMz2(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function (e) {
                // Instantly encodes file to base64 via native browser module
                const base64Content = e.target.result.split(',')[1];

                try {
                    const res = await fetch('http://localhost:8080/api/import_mz2', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, content: base64Content })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        alert(`Successfully imported ${data.imported} recipes into the "${data.cookbook}" cookbook!`);
                        window.location.reload();
                    } else {
                        alert(`Error importing XML / MZ2 file. Server responded with Status ${res.status}`);
                    }
                } catch (err) {
                    console.error('Import error', err);
                    alert(`Error communicating with server: ${err.message}`);
                } finally {
                    document.getElementById('importMz2File').value = '';
                }
            };
            reader.readAsDataURL(file);
        }

        async function handleRestore(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!confirm(`WARNING: This will completely overwrite your existing recipe database with the contents of ${file.name}.\n\nAre you sure you want to proceed?`)) {
                document.getElementById('restoreFile').value = '';
                return;
            }

            const formData = new FormData();

            try {
                // Post the raw file as a binary Blob since we aren't using multipart parser on backend
                const response = await fetch('http://localhost:8080/api/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/zip' },
                    body: file
                });

                if (response.ok) {
                    alert('Restore successful! The page will now reload.');
                    window.location.reload();
                } else {
                    const err = await response.json();
                    alert('Restore failed: ' + err.message);
                }
            } catch (e) {
                alert('Error connecting to restore API.');
                console.error(e);
            } finally {
                document.getElementById('restoreFile').value = '';
            }
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 600) {
                loadRecipes(false);
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadRecipes(true), 300);
        });

        document.addEventListener("DOMContentLoaded", async () => {
            await loadCookbooks();
            await loadCategories();
            loadRecipes(true);
        });
    </script>

</body>

</html>
